[package]
name = "agile-net-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
ip_network = { workspace = true }
ip_network_table = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
arc-swap = { workspace = true }
rand = { workspace = true }
rcgen = { workspace = true }
rustls-pemfile = { workspace = true }
webpki-roots = { workspace = true }
sha2 = { workspace = true }
# E2E channel crypto (federation P3): HKDF key derivation + AES-256-GCM sealing.
# Same ring version the workspace rustls provider and the node crate already use — zero new build cost.
ring = "0.17"

[dev-dependencies]
# test-util：令牌桶单测用 tokio::time::pause 虚拟时钟（full 不含该 feature）
tokio = { workspace = true, features = ["test-util"] }
