[package]
name = "agile-net-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agile_net_node"
path = "src/lib.rs"

[[bin]]
name = "anet-svc"
path = "src/main.rs"

[dependencies]
agile-net-core = { path = "../core" }
agile-net-client = { path = "../client" }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pemfile = { workspace = true }
axum = { workspace = true }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower = { workspace = true }
tower-http = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
thiserror = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
arc-swap = { workspace = true }
sha2 = { workspace = true }
ring = "0.17"
base64 = "0.22"
qrcode = { workspace = true }
# QR 图片解码（统一导入组件 agimport.js：管理端 /api/v1/admin/tool/qr-decode 与 anet-gui qr_pick_decode 共用；
# image 与 qrcode 传递依赖同版 0.25，rqrr 纯 Rust 无 C 依赖）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rqrr = "0.10"
sysinfo = { workspace = true }
clap = { workspace = true }
rpassword = "7"
reqwest = { workspace = true }
dashmap = { workspace = true }
ip_network = { workspace = true }
rcgen = { workspace = true }
instant-acme = { version = "0.8", default-features = false, features = ["ring", "rcgen", "hyper-rustls"] }
# 内置网络诊断工具集（anet tool；一律 default-features = false 起步，见 docs/todo/cli-tool.md §5）
netstat2 = { version = "0.11", default-features = false }
default-net = { version = "0.22", default-features = false }
surge-ping = { version = "0.9", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { workspace = true }
