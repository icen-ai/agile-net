<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="adm.title">AgileNet 控制台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233C3F43' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z'/></svg>">
<script>try{const _p=new URLSearchParams(location.search);const _q=_p.get('theme');if(_q)localStorage.setItem('ag_theme',_q);document.documentElement.dataset.theme=localStorage.getItem('ag_theme')||'light';if(_p.get('embed'))document.documentElement.classList.add('embed')}catch(e){}</script>
<link rel="stylesheet" href="/ui/tokens.css">
<link rel="stylesheet" href="/ui/components.css">
<link rel="stylesheet" href="/ui/style.css">
</head>
<body>
<header id="titlebar">
  <button class="tb-icon" id="btn-collapse" data-i18n-title="menu.collapse" title="收起 / 展开菜单"><i data-ic="panel-left" data-sz="16"></i></button>
  <div class="tb-drag" data-tauri-drag-region><span class="tb-title" data-tauri-drag-region data-i18n="adm.title">AgileNet 控制台</span></div>
  <div class="tb-controls">
    <button id="tb-min" data-i18n-title="menu.min" title="最小化"><i data-ic="minus" data-sz="15"></i></button>
    <button id="tb-max" data-i18n-title="menu.max" title="最大化 / 还原"><i data-ic="square" data-sz="12"></i></button>
    <button id="tb-close" class="close" data-i18n-title="common.close" title="关闭"><i data-ic="x" data-sz="16"></i></button>
  </div>
</header>
<div id="toasts"></div>
<div id="modal-root"></div>

<div id="login-view">
  <div class="login-card">
    <button class="ghost small" id="login-theme-btn" data-i18n-title="adm.toggleTheme" title="切换主题"></button>
    <div class="logo"><i data-ic="zap" data-sz="22"></i></div>
    <h1>AgileNet</h1>
    <p data-i18n="login.subtitle">企业级网络穿透与代理链路由 · 管理控制台</p>
    <input id="login-user" type="text" data-i18n-ph="login.userPh" placeholder="用户名" autocomplete="username">
    <input id="login-pass" type="password" data-i18n-ph="common.password" placeholder="密码" autocomplete="current-password">
    <button id="login-btn" data-i18n="login.submit">登录</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- Ticket-console bootstrap state (remote admin console over the tunnel): shown instead of the
     login form while the one-time ticket exchange runs — the credential form cannot help there -->
<div id="boot-view">
  <div class="login-card">
    <div class="logo"><i data-ic="zap" data-sz="22"></i></div>
    <h1>AgileNet</h1>
    <div class="boot-spin" id="boot-spin"></div>
    <p id="boot-msg"></p>
    <div class="hint" id="boot-hint" style="display:none"></div>
    <button id="boot-retry" class="ghost" style="display:none" data-i18n="common.retry">重试</button>
  </div>
</div>

<div id="app">
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="logo"><i data-ic="zap" data-sz="15"></i></span><span class="brand-text">AgileNet</span><select id="lang-select" style="margin-left:auto;width:auto;padding:3px 6px;font-size:12px"><option value="zh" data-i18n="lang.zh">简体中文</option><option value="en" data-i18n="lang.en">English</option></select></div>
    <div class="nav-item" data-view="dashboard"><i data-ic="layout-dashboard"></i><span class="nav-label" data-i18n="menu.home">首页</span></div>
    <div class="nav-item" data-view="groups"><i data-ic="shield"></i><span class="nav-label" data-i18n="menu.groups">权限</span></div>
    <div class="nav-item" data-view="rules"><i data-ic="route"></i><span class="nav-label" data-i18n="menu.rules">规则</span></div>
    <div class="nav-item" data-view="fanin"><i data-ic="orbit"></i><span class="nav-label" data-i18n="term.fanin">扇入</span></div>
    <div class="nav-item" data-view="connectors"><i data-ic="git-fork"></i><span class="nav-label" data-i18n="term.fanout">扇出</span></div>
    <div class="nav-item" data-view="devices"><i data-ic="monitor-smartphone"></i><span class="nav-label" data-i18n="menu.devices">设备</span></div>
    <div class="nav-item" data-view="approvals"><i data-ic="stamp"></i><span class="nav-label" data-i18n="menu.approvals">审批</span><span class="nav-badge" id="nav-approvals-badge" hidden></span></div>
    <div class="nav-item" data-view="topo"><i data-ic="earth"></i><span class="nav-label" data-i18n="menu.topo">拓扑</span></div>
    <div class="nav-item" data-view="audit"><i data-ic="scroll-text"></i><span class="nav-label" data-i18n="menu.audit">审计</span></div>
    <div class="nav-item" data-view="settings"><i data-ic="settings"></i><span class="nav-label" data-i18n="menu.settings">设置</span></div>
    <div class="sidebar-footer">
      <div id="me-info">-</div>
      <div style="margin-top:8px;display:flex;gap:6px">
        <button class="ghost small" id="theme-btn"></button>
        <button class="ghost small" id="logout-btn"><i data-ic="log-out" data-sz="13"></i><span data-i18n="adm.logout">退出登录</span></button>
      </div>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
</div>

<script src="/ui/icons.js"></script>
<script src="/ui/agutil.js"></script>
<script src="/ui/aglink.js"></script>
<script src="/ui/aganet.js"></script>
<script src="/ui/agimport.js"></script>
<script src="/ui/agchart.js"></script>
<script src="/ui/agi18n.js"></script>
<script src="/ui/aglang.js"></script>
<script src="/ui/agtbl.js"></script>
<script src="/ui/lang/admin.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
