name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  chain-test:
    name: Docker 四级链路门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build anet image
        run: docker build -f .docker/Dockerfile -t anet:dev .
      - name: Run chain test (T1-T6)
        run: |
          docker compose -f .docker/docker-compose.test.yaml up \
            --abort-on-container-exit --exit-code-from tester
      - name: Cleanup
        if: always()
        run: docker compose -f .docker/docker-compose.test.yaml down -v

  desktop-check:
    name: Desktop Client Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: Install Tauri system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --manifest-path apps/desktop/Cargo.toml

  release:
    name: Release (Windows Installer + SHA256)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-release
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installers
        working-directory: apps/desktop
        run: cargo tauri build
      - name: Generate SHA256 checksums
        working-directory: apps/desktop/target/release/bundle
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.msi,*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/target/release/bundle/msi/*.msi
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/bundle/SHA256SUMS.txt
