name: Release

# 发布流程：打 tag 推送（git tag vX.Y.Z && git push origin vX.Y.Z）即自动
# 构建全平台产物并挂载到 GitHub Release；也支持 Actions 页面手动触发（draft 预检）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: '以 draft 草稿形式创建 Release'
        required: false
        default: 'true'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== anet-svc 全平台二进制 ====================
  svc:
    name: anet-svc ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: '.exe' }
          - { name: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: '' }
          # musl 静态链接：兼容麒麟 V10 / 统信 UOS 等老 glibc 发行版
          - { name: linux-x64-musl, os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: '' }
          - { name: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, ext: '' }
          - { name: macos-x64, os: macos-13, target: x86_64-apple-darwin, ext: '' }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, ext: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: svc-release

      - name: Install cross toolchain (linux-arm64)
        if: matrix.name == 'linux-arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Install musl toolchain
        if: matrix.name == 'linux-x64-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build anet-svc
        run: cargo build --release -p agile-net-node --target ${{ matrix.target }}

      - name: Package binary + SHA256
        shell: bash
        run: |
          mkdir -p dist
          bin="dist/anet-svc-${{ matrix.name }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/anet-svc${{ matrix.ext }}" "$bin"
          cd dist && sha256sum "anet-svc-${{ matrix.name }}${{ matrix.ext }}" > "anet-svc-${{ matrix.name }}${{ matrix.ext }}.sha256"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' || false }}
          files: dist/*

  # ==================== anet-gui Windows 安装包 ====================
  gui-windows:
    name: anet-gui Windows (msi/nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-windows-release
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installers
        working-directory: apps/desktop
        run: cargo tauri build
      - name: Generate SHA256 checksums
        working-directory: apps/desktop/target/release/bundle
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.msi,*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' || false }}
          files: |
            apps/desktop/target/release/bundle/msi/*.msi
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/bundle/SHA256SUMS.txt

  # ==================== anet-gui macOS dmg ====================
  gui-macos:
    name: anet-gui macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, os: macos-13, target: x86_64-apple-darwin }
          - { arch: arm64, os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-macos-release
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build dmg
        working-directory: apps/desktop
        run: cargo tauri build --target ${{ matrix.target }} --bundles dmg
      - name: Generate SHA256 checksums
        working-directory: apps/desktop/target/${{ matrix.target }}/release/bundle
        shell: bash
        run: |
          rm -f SHA256SUMS.txt
          for f in dmg/*.dmg; do sha256sum "$f" >> SHA256SUMS.txt; done
          cat SHA256SUMS.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' || false }}
          files: |
            apps/desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/target/${{ matrix.target }}/release/bundle/SHA256SUMS.txt

  # ==================== anet-gui Ubuntu deb / AppImage ====================
  gui-ubuntu:
    name: anet-gui Ubuntu (deb/AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-ubuntu-release
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build deb + AppImage
        working-directory: apps/desktop
        run: cargo tauri build --bundles deb,appimage
      - name: Generate SHA256 checksums
        working-directory: apps/desktop/target/release/bundle
        shell: bash
        run: |
          rm -f SHA256SUMS.txt
          find . \( -name '*.deb' -o -name '*.AppImage' \) -exec sha256sum {} \; | sed 's|  \./|  |' >> SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' || false }}
          files: |
            apps/desktop/target/release/bundle/deb/*.deb
            apps/desktop/target/release/bundle/appimage/*.AppImage
            apps/desktop/target/release/bundle/SHA256SUMS.txt

  # ==================== anet-gui Android apk（debug 签名，可侧载；正式签名待 keystore secrets） ====================
  gui-android:
    name: anet-gui Android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-android-release
      - name: Configure Android NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Init android project
        working-directory: apps/desktop
        run: cargo tauri android init
      - name: Build apk（debug 签名可侧载）
        working-directory: apps/desktop
        run: cargo tauri android build --apk --debug
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.draft == 'true' || false }}
          files: apps/desktop/gen/android/app/build/outputs/apk/**/*.apk
