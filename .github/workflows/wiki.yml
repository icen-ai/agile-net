name: Wiki Deploy

# 文档站部署：wiki/** 变更推送到 master 即自动发布到 Cloudflare Pages。
# 需要仓库 secrets：CF_API_TOKEN（Pages 权限的 Cloudflare API Token）、CF_ACCOUNT_ID。
# 与本地 `wrangler pages deploy wiki --project-name anet` 等效，但不受本地网络影响。
on:
  push:
    branches: [master]
    paths: ['wiki/**']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy wiki to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy wiki --project-name anet --branch master
