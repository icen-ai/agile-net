[package]
name = "anet-gui"
version = "0.1.0"
edition = "2021"
description = "anet-gui：AgileNet 全功能图形客户端（Windows/macOS/Linux/Android）"
license = "MIT"

[lib]
name = "anet_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "anet-gui"
path = "src/main.rs"

# 独立于主 workspace 构建（Tauri 依赖体量大）
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agile-net-client = { path = "../../crates/client" }
agile-net-core = { path = "../../crates/core" }
agile-net-node = { path = "../../crates/node" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
