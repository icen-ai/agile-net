[package]
name = "anet-gui"
version = "0.1.0"
edition = "2021"
description = "anet-gui：AgileNet 全功能图形客户端（Windows/macOS/Linux/Android）"
license = "MIT"

[lib]
name = "anet_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "anet-gui"
path = "src/main.rs"

# 独立于主 workspace 构建（Tauri 依赖体量大）
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agile-net-client = { path = "../../crates/client" }
agile-net-core = { path = "../../crates/core" }
agile-net-node = { path = "../../crates/node" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 订阅脚本沙箱（嵌入式 QuickJS，无外部运行时）与配置管线（YAML ↔ JSON）
rquickjs = { version = "0.12", default-features = false, features = ["std"] }
serde_yaml = "0.9"

[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows-sys = { version = "0.59", features = [
    "Win32_Networking_WinInet",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
