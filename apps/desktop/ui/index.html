<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgileNet 客户端</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="brand">⚡ AgileNet</div>
  <div class="proxy-pill" id="proxy-pill">
    <span class="dot off" id="proxy-dot"></span><span id="proxy-text">代理未启动</span>
  </div>
</header>

<main>
  <div id="net-banner" class="net-banner" style="display:none"></div>
  <!-- 空状态引导（未连接任何节点时显示） -->
  <section id="onboarding" class="hero" style="display:none">
    <div class="hero-logo">⚡</div>
    <h1>欢迎使用 AgileNet</h1>
    <p class="hero-sub">企业级网络穿透与代理链路由 · 三步接入您的内网</p>
    <div class="hero-steps">
      <div class="hero-step"><span class="num">1</span>向管理员索取<b>接入链接</b><br><span class="dim">(agilenet://connect?...)</span></div>
      <div class="hero-step"><span class="num">2</span>粘贴到下方<b>一键连接</b></div>
      <div class="hero-step"><span class="num">3</span>启动<b>本地代理</b>即可访问内网</div>
    </div>
    <div class="hero-input">
      <input id="connect-url-hero" class="mono" placeholder="粘贴接入链接 agilenet://connect?...">
      <button id="btn-import-hero" class="big">🚀 一键接入</button>
    </div>
    <div class="hero-alt">或 <a href="javascript:void(0)" onclick="pasteFromClipboard()">从剪贴板导入</a> · <a href="javascript:void(0)" onclick="toggleManual(true)">手动填写</a></div>
  </section>

  <!-- 快速接入（有节点后的紧凑条） -->
  <section class="card" id="quick-card">
    <div class="row">
      <input id="connect-url" class="grow mono" placeholder="粘贴接入链接添加另一个节点 agilenet://connect?...">
      <button id="btn-import">导入并连接</button>
      <button id="btn-paste" class="ghost" title="从剪贴板导入">📋</button>
    </div>
  </section>

  <!-- 本地代理 -->
  <section class="card">
    <h3>🔌 本地代理 <span class="hint inline">SOCKS5 / HTTP 自动识别，仅监听 127.0.0.1</span></h3>
    <div class="row">
      <label>端口</label>
      <input id="proxy-port" type="number" value="7890" style="width:100px">
      <button id="btn-proxy-toggle" class="ghost">启动代理</button>
      <span class="hint" id="proxy-hint"></span>
    </div>
  </section>

  <!-- 节点列表 -->
  <section class="card">
    <h3>🌐 节点 <button class="ghost small" id="btn-refresh" title="刷新">⟳</button></h3>
    <div id="nodes-list"><div class="empty">尚未连接节点</div></div>
  </section>

  <!-- 手动添加 -->
  <section class="card">
    <h3 onclick="toggleManual()" style="cursor:pointer">➕ 手动添加节点 <span class="hint" id="manual-arrow">▸</span></h3>
    <div id="manual-form" style="display:none">
      <div class="grid2">
        <div><label>节点 API 地址（host:port 或 https://…）</label><input id="m-addr" placeholder="cdn.example.com:9090"></div>
        <div><label>账号</label><input id="m-user" placeholder="zhangsan"></div>
        <div><label>密码</label><input id="m-pass" type="password" placeholder="sk-..."></div>
        <div><label>证书固定 PEM 路径（可选，生产推荐）</label><input id="m-pin" placeholder="certs/node.pem"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <label class="chk"><input type="checkbox" id="m-insecure"> 跳过证书校验（仅开发）</label>
        <label class="chk"><input type="checkbox" id="m-hosts"> 管理系统 hosts</label>
        <label class="chk"><input type="checkbox" id="m-save" checked> 保存凭据</label>
        <button id="btn-connect">连接</button>
      </div>
    </div>
  </section>

  <!-- 已保存节点 -->
  <section class="card" id="creds-card" style="display:none">
    <h3>💾 已保存节点</h3>
    <div id="creds-list"></div>
  </section>

  <!-- 合并路由 -->
  <section class="card" id="rules-card" style="display:none">
    <h3>🔀 生效路由（合并视图）</h3>
    <table><thead><tr><th>类型</th><th>匹配值</th><th>节点</th></tr></thead><tbody id="rules-body"></tbody></table>
  </section>

  <!-- 设置 -->
  <section class="card">
    <h3>⚙️ 设置</h3>
    <div class="row col">
      <label class="chk"><input type="checkbox" id="s-autostart"> 开机自动启动 AgileNet</label>
      <label class="chk"><input type="checkbox" id="s-autoproxy" checked> 连接节点后自动启动本地代理</label>
      <label class="chk"><input type="checkbox" id="s-autoreconnect" checked> 启动应用时自动重连已保存节点</label>
      <div class="lang-theme">
        <select id="s-lang">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <select id="s-theme">
          <option value="dark">🌙 深色</option>
          <option value="light">☀️ 浅色</option>
        </select>
      </div>
      <div class="hint" data-i18n="hint-tray">关闭主窗口将最小化到系统托盘，右键托盘图标可退出</div>
    </div>
  </section>
</main>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
